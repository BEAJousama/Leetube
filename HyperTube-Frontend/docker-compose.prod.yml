services:
  hypertube-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: hypertube-frontend-prod
    ports:
      - "3001:5173"
    networks:
      - hypertube-network
    restart: unless-stopped

networks:
  hypertube-network:
    external: true
    name: hypertube-network
